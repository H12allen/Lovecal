<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Love Calculator</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>❤️ Love Calculator</h1>

        <p class="subtitle">Discover your love compatibility score</p>

        <input type="text" id="Yname" placeholder="Your Name" />

        <input type="text" id="Tname" placeholder="Partner's Name" />

        <button id="sub">Calculate Love</button>

        <div id="result" class="hidden">
          <div class="percentage">
            <span id="score">0%</span>
          </div>

          <h2 id="couple"></h2>

          <p id="message"></p>
        </div>
        <button id="reset" class="reset-btn hidden">
          ❤️ Calculate Another Match
        </button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
